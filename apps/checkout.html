<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Checkout - Aluna Premium Apps</title>
  <link rel="stylesheet" href="../assets/css/checkout.css">
</head>
<body class="apps-checkout">
  <header class="checkout-header">
    <div class="checkout-header__inner"><a href="index.html">← Kembali</a><h1>Checkout Premium Apps</h1></div>
  </header>
  <main class="checkout-shell">
    <div id="checkout-notice"></div>
    <section class="box"><div class="order-id"><strong>Order ID</strong><span id="order-id">-</span></div></section>
    <section class="box"><h2>Pesanan</h2><div id="checkout-items"><div class="empty-state">Memuat keranjang...</div></div><div class="total-row"><span>Total</span><span id="checkout-total">Rp0</span></div></section>
    <section class="box">
      <h2>Data Pemesan</h2>
      <label class="form-field"><span>Nama</span><input id="name" autocomplete="name" placeholder="Nama kamu" required></label>
      <label class="form-field"><span>Catatan (opsional)</span><textarea id="notes" placeholder="Tulis kebutuhan atau akun yang digunakan"></textarea></label>
    </section>
    <button class="checkout-button" id="order-button" type="button" disabled>Kirim Pesanan via WhatsApp</button>
  </main>
  <script type="module" src="../assets/js/apps-checkout.js"></script>
</body>
</html>
