<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6b00">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <title>Checkout - Aluna Eats</title>
  <link rel="stylesheet" href="../assets/css/checkout.css">
</head>
<body>
  <header class="checkout-header">
    <div class="checkout-header__inner"><a href="index.html">← Kembali</a><h1>Checkout Aluna Eats</h1></div>
  </header>
  <main class="checkout-shell">
    <div id="checkout-notice"></div>
    <section class="box"><div class="order-id"><strong>Order ID</strong><span id="order-id">-</span></div></section>
    <section class="box"><h2>Pesanan</h2><div id="checkout-items"><div class="empty-state">Memuat keranjang...</div></div><div class="total-row"><span>Total</span><span id="checkout-total">Rp0</span></div></section>
    <section class="box">
      <h2>Data Pemesan</h2>
      <label class="form-field"><span>Nama</span><input id="name" autocomplete="name" placeholder="Nama kamu" required></label>
      <label class="form-field"><span>Alamat lengkap</span><input id="address" autocomplete="street-address" placeholder="Alamat pengantaran" required></label>
      <label class="form-field"><span>Nomor HP</span><input id="phone" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></label>
      <label class="form-field"><span>Pengantaran</span><select id="shipping-mode"><option value="pickup">Ambil sendiri (Gratis)</option><option value="delivery">Diantar - hitung ongkir otomatis</option></select></label>
      <div class="delivery-location" id="delivery-location" hidden>
        <button class="location-button" id="location-button" type="button">📍 Gunakan Lokasi Saya</button>
        <div class="shipping-status" id="shipping-status">Lokasi belum dihitung.</div>
        <small class="location-help">Gunakan lokasi saat kamu berada di alamat pengantaran. Aktifkan GPS dan izinkan browser mengakses lokasi.</small>
      </div>
      <label class="form-field"><span>Catatan (opsional)</span><textarea id="notes" placeholder="Contoh: saus dipisah"></textarea></label>
    </section>
    <button class="checkout-button" id="order-button" type="button" disabled>Pesan Sekarang via WhatsApp</button>
  </main>
  <script type="module" src="../assets/js/food-checkout.js"></script>
</body>
</html>
