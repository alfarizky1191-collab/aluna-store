<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Preview Aluna Store</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #e5eaf2; border-radius: 22px; padding: 28px; box-shadow: 0 18px 50px rgba(23,32,51,.09); }
    h1 { margin: 0 0 8px; }
    p { color: #667085; line-height: 1.6; }
    .notice { padding: 12px 14px; border-radius: 12px; background: #fff7df; color: #7a4d00; }
    nav { display: grid; gap: 12px; margin-top: 24px; }
    a { display: flex; justify-content: space-between; padding: 16px 18px; border-radius: 14px; color: #fff; background: #2563eb; text-decoration: none; font-weight: 700; }
    a:nth-child(2) { background: #f97316; }
    a:nth-child(3) { background: #182230; }
  </style>
</head>
<body>
  <main>
    <h1>Preview Aluna Store</h1>
    <p>Area uji coba katalog dinamis sebelum fitur digabungkan ke website utama.</p>
    <p class="notice">Perubahan dari halaman admin masuk ke database sungguhan, tetapi belum memengaruhi halaman toko utama.</p>
    <nav>
      <a href="apps/">Preview Premium Apps <span>→</span></a>
      <a href="food/">Preview Aluna Eats <span>→</span></a>
      <a href="admin/">Masuk Admin <span>→</span></a>
    </nav>
  </main>
</body>
</html>
