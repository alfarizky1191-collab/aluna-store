<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ff6b00">
  <title>Preview Checkout - Aluna Eats</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/alfarizky1191-collab/aluna-store@8a066996e3dbb23b271ae9e9c970715d08816124/assets/css/checkout.css">
</head>
<body>
  <header class="checkout-header"><div class="checkout-header__inner"><a href="index.html">← Kembali</a><h1>Checkout Aluna Eats</h1></div></header>
  <main class="checkout-shell">
    <div id="checkout-notice"></div>
    <section class="box"><div class="order-id"><strong>Order ID</strong><span id="order-id">-</span></div></section>
    <section class="box"><h2>Pesanan</h2><div id="checkout-items"><div class="empty-state">Memuat keranjang...</div></div><div class="total-row"><span>Total</span><span id="checkout-total">Rp0</span></div></section>
    <section class="box"><h2>Data Pemesan</h2><label class="form-field"><span>Nama</span><input id="name" autocomplete="name" placeholder="Nama kamu" required></label><label class="form-field"><span>Alamat lengkap</span><input id="address" autocomplete="street-address" placeholder="Alamat pengantaran" required></label><label class="form-field"><span>Nomor HP</span><input id="phone" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></label><label class="form-field"><span>Pengantaran</span><select id="shipping"><option value="0">Ambil sendiri (Gratis)</option><option value="3000">Dekat 0–2 km (Rp3.000)</option><option value="8000">Sedang 2–5 km (Rp8.000)</option><option value="15000">Jauh 5–8 km (Rp15.000)</option></select></label><label class="form-field"><span>Catatan (opsional)</span><textarea id="notes" placeholder="Contoh: saus dipisah"></textarea></label></section>
    <button class="checkout-button" id="order-button" type="button" disabled>Pesan Sekarang via WhatsApp</button>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/gh/alfarizky1191-collab/aluna-store@8a066996e3dbb23b271ae9e9c970715d08816124/assets/js/food-checkout.js"></script>
</body>
</html>
